name: ci

on:
  pull_request:
  push:
    branches:
      - main

# GITHUB_TOKEN is read-only by default; deploy needs write to push gh-pages.
permissions:
  contents: read

jobs:
  test_and_maybe_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: 'latest'

      - name: Build
        run: mdbook build

      - name: Test
        run: mdbook test

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
        # Only deploy on a push to main, not on a pull request.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
